name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  # Test DB used only by DB-backed test suites; pure-logic suites run without it.
  DATABASE_URL: postgresql://kaziflow:kaziflow@localhost:5432/kaziflow_test

jobs:
  quality:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (report-only)
        # ESLint is report-only: it surfaces debt without blocking the pipeline.
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        # Type-checks application/library code (tests + generated .next types
        # are excluded so the signal reflects shippable code).
        run: npx tsc --noEmit -p tsconfig.ci.json

      - name: Unit & integration tests (pure-logic, no DB required)
        run: npm test

  build:
    name: Production build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `next build` compiles every route and catches type/SSR regressions.
      - name: Build
        run: npm run build
        env:
          # Build must succeed regardless of secret availability; use placeholders.
          DATABASE_URL: postgresql://user:pass@localhost:5432/kaziflow
          AUTH_SECRET: this-is-a-ci-placeholder-not-a-real-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Trufflehog needs full history to diff against the default branch.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high || true

      - name: Detect secrets (Trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
