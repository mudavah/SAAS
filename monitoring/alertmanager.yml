# Alertmanager configuration for KaziFlow.
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: oncall
      repeat_interval: 1h
    - matchers:
        - severity = "warning"
      receiver: slack

receivers:
  - name: default
    webhook_configs:
      - url: ${ALERT_WEBHOOK_URL}

  - name: oncall
    webhook_configs:
      - url: ${ALERT_WEBHOOK_URL}
    email_configs:
      - to: ops@kaziflow.co.ke
        from: alerts@kaziflow.co.ke
        smarthost: ${SMTP_HOST}:587
        auth_username: ${SMTP_USER}
        auth_password: ${SMTP_PASS}

  - name: slack
    slack_configs:
      - api_url: ${SLACK_WEBHOOK_URL}
        channel: "#kaziflow-alerts"
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["alertname"]
